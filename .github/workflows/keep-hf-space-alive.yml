name: Keep HF Space Awake

on:
  schedule:
    # 每30分钟请求一次，防止容器休眠
    - cron: '*/30 * * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping HF Space
        run: |
          echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') - Pinging HF Space..."
          curl -sf -o /dev/null -w "HTTP %{http_code}" \
            https://zh568972743-openclaw.hf.space \
            --connect-timeout 10 \
            --max-time 30 || true
