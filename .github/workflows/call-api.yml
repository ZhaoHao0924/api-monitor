name: HF Space Keep-Alive

on:
  # 每天北京时间 8:00 保活一次
  schedule:
    - cron: '0 0 * * *'
    
  # 允许手动触发
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v3
      
    - name: ⎔ 设置Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 安装依赖
      run: npm ci
      
    - name: 🚀 保活 HF Space
      env:
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        NODE_ENV: production
      run: |
        echo "🚀 开始保活 OpenClaw HF Space..."
        node src/index.js
        echo "✅ 保活完成！"
        
    - name: 📊 保存日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: keepalive-log
        path: |
          logs/
        retention-days: 7
