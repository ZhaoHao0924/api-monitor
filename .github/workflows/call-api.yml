name: API Monitor

on:
  # 定时触发（UTC时间，北京时间+8）
  schedule:
    # 每天北京时间 8:00 和 20:00 各运行一次
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
    
    # 其他示例cron表达式：
    # - cron: '0 0 * * *'      # 每天UTC午夜（北京8点）
    # - cron: '0 12 * * *'     # 每天UTC 12点（北京20点）
    # - cron: '*/30 * * * *'   # 每30分钟
    
  # 允许手动触发
  workflow_dispatch:
    inputs:
      endpoints:
        description: '要测试的端点（逗号分隔，留空为全部）'
        required: false
        default: ''
      verbose:
        description: '详细输出'
        required: false
        type: boolean
        default: false
        
jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v3
      
    - name: ⎔ 设置Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 安装依赖
      run: npm ci
      
    - name: 🚀 运行API监控
      id: monitor
      env:
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        NODE_ENV: production
      run: |
        echo "开始运行API监控..."
        node src/index.js
        echo "监控完成！"
        
    - name: 📊 保存测试结果
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: api-monitor-results
        path: |
          logs/
        retention-days: 7
