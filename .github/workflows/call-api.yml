name: API Monitor & HF Space Keep-Alive

on:
  # 每30分钟运行一次（保活 + 监控 + 告警）
  schedule:
    - cron: '*/30 * * * *'
    
  # 允许手动触发
  workflow_dispatch:
    inputs:
      verbose:
        description: '详细输出'
        required: false
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v3
      
    - name: ⎔ 设置Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 安装依赖
      run: npm ci
      
    - name: 🚀 运行API监控 + HF Space保活
      env:
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        NODE_ENV: production
      run: |
        echo "🚀 开始运行API监控 + HF Space保活..."
        node src/index.js
        echo "✅ 监控完成！"
        
    - name: 📊 保存测试结果
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: monitor-results
        path: |
          logs/
        retention-days: 7
